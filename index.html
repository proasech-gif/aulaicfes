function calEval(it){
  const K=calParseKey(CAL.key),M=PLANTILLAS[it.model],o={ok:0,bad:0,anu:0,rev:0,n:0,reasons:{},list:[]};
  for(const row of M.preguntas){const q=row[0];if(!K[q])continue;const v=it.res[q];if(!v)continue;o.n++;
    const ov=it.ov[q];let letter=null,why=null,pend=false;
    if(ov==='X')why='anulada por el docente';else if(ov)letter=ov;
    else if(v.st==='ok')letter=v.r;else if(v.st==='revisar'){why='relleno incompleto';pend=true}else why=v.r;
    if(letter){if(letter===K[q])o.ok++;else o.bad++}
    else{o.anu++;if(pend)o.rev++;o.reasons[why]=(o.reasons[why]||0)+1}
    if(v.st!=='ok'||ov)o.list.push({q,v,ov,letter,why,pend,nopt:row.length-1})}
  o.nota=o.n?Math.round(50*o.ok/o.n)/10:0;o.pct=o.n?Math.round(100*o.ok/o.n):0;return o}

const FMT={excel:'Excel o CSV',word:'Word',pdf:'PDF',text:'texto'};

const LOADED={};
function loadScript(src){
  if(!LOADED[src])LOADED[src]=new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{delete LOADED[src];ko(new Error('No se pudo cargar la herramienta para leer el archivo. Revisa tu conexión a internet.'))};document.head.appendChild(s)});
  return LOADED[src];
}
const EMAIL_RE=/[^\s@;,|<>()]+@[^\s@;,|<>()]+\.[^\s@;,|<>()]+/;
const DOC_RE=/^\d{1,3}(?:\.\d{3})+$|^\d{6,12}$/;
function parseLine(line){
  const m=line.match(EMAIL_RE),email=m?m[0].toLowerCase().replace(/[.]+$/,''):'';
  const toks=(m?line.replace(m[0],' '):line).split(/[;,\t|]+/).join(' ').split(/\s+/).filter(Boolean);
  let doc='';const nt=[];
  toks.forEach(t=>{
    if(!doc&&DOC_RE.test(t)){const d=t.replace(/\./g,'');if(!(d.length===10&&d[0]==='3')){doc=d;return}}
    if(/^\d+[.)-]?$/.test(t)||/^\d{1,2}[°º]?[A-Za-zñÑ]?$/.test(t))return;
    nt.push(t);
  });
  const name=nt.join(' ').trim();
  if(!name||(!email&&!doc))return null;
  return{email,full_name:name,document:doc};
}
async function readFile(file,f){
  const lines=[];
  if(f==='excel'){
    await loadScript(LIB.xlsx);
    const isCsv=/\.csv$/i.test(file.name);
    const wb=isCsv?XLSX.read(await file.text(),{type:'string'}):XLSX.read(await file.arrayBuffer(),{type:'array'});
    wb.SheetNames.forEach(n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).forEach(r=>lines.push(r.map(x=>String(x).trim()).filter(Boolean).join(' ; '))));
  }
  if(f==='word'){
    await loadScript(LIB.mammoth);
    const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
    const doc=new DOMParser().parseFromString(r.value,'text/html');
    doc.querySelectorAll('tr').forEach(tr=>lines.push([...tr.children].map(c=>c.textContent.trim()).filter(Boolean).join(' ; ')));
    doc.querySelectorAll('p,li').forEach(p=>{if(!p.closest('table'))lines.push(p.textContent.trim())});
  }
  if(f==='pdf'){
    await loadScript(LIB.pdf);pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    for(let p=1;p<=pdf.numPages;p++){
      const tc=await(await pdf.getPage(p)).getTextContent(),rows={};
      tc.items.forEach(it=>{if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);(rows[y]=rows[y]||[]).push({x:it.transform[4],t:it.str})});
      Object.keys(rows).map(Number).sort((a,b)=>b-a).forEach(y=>lines.push(rows[y].sort((a,b)=>a.x-b.x).map(i=>i.t.trim()).join(' ')));
    }
    if(!lines.length)throw new Error('No encontré texto en el PDF. Si es un PDF escaneado (una foto), usa Excel o Word.');
  }
  return lines;
}
function setRows(lines){
  const seen=new Set(),rows=[],bad=[],sk=[];let skip=0;
  lines.forEach(l=>{l=(l||'').trim();if(!l)return;const p=parseLine(l);
    if(!p){if(/[A-Za-zÁ-ú]/.test(l)){skip++;if(sk.length<15)sk.push(l)}return}
    p.document=(p.document||'').replace(/\D/g,'');
    const palabras=p.full_name.trim().split(/\s+/).filter(w=>/[A-Za-zÁ-ú]/.test(w)),why=[];
    if(p.document.length<5)why.push('falta el número de documento');
    if(palabras.length<2)why.push('falta el nombre completo (nombres y apellidos)');
    if(why.length){bad.push({l,why:why.join(' y ')});return}
    if(seen.has(p.document))return;seen.add(p.document);rows.push(p)});
  RF.rows=rows;RF.skip=skip;RF.sk=sk;RF.bad=bad;
  if(!rows.length)toast('⚠️','No encontré estudiantes válidos','Cada fila debe tener el nombre completo y el número de documento del estudiante.');
}

async function startSim(simId){
  const sim=(D.sims||[]).find(x=>x.id===simId);if(!sim)return;
  const secs=sim.minutes_per_question*60,n=sim.n_questions;
  const{data,error}=await sb.from('questions').select('id,part,body,options,image_path,stimulus_title,stimulus_content').eq('grade',sim.grade).eq('subject',sim.subject).eq('active',true);
  if(error)return err(error);
  if(data.length<n)return toast('⚠️','No disponible','Hay '+data.length+' preguntas visibles y se piden '+n+'. Avisa a tu docente.');
  const qs=data.sort(()=>Math.random()-.5).slice(0,n);
  const total=qs.length*secs;
  S={grade:sim.grade,subject:sim.subject,qs,ans:{},total,left:total,i:0,sending:false,simId:sim.id,title:sim.title};
  clearInterval(timer);
  timer=setInterval(()=>{if(!S)return;S.left--;const e=document.getElementById('clk');if(e){e.textContent=fmt(S.left);e.className='font-mono text-2xl font-bold '+(S.left<30?'text-red-600':'text-indigo-700')}if(S.left<=0)finish(true)},1000);
  render();
}
async function finish(auto){
  if(!S||S.sending)return;S.sending=true;clearInterval(timer);
  const answers=Object.fromEntries(S.qs.map(q=>[q.id,S.ans[q.id]??null]));
  const{data,error}=await sb.rpc('submit_attempt',{p_grade:S.grade,p_subject:S.subject,p_answers:answers,p_seconds_left:Math.max(0,S.left),p_auto:!!auto,p_simulacro_id:S.simId});
  if(error){S.sending=false;return err(error)}
  RES={...data,auto,qs:S.qs,ans:S.ans};S=null;
  (data.new_medals||[]).forEach(k=>{const m=MEDALS[k];if(m)toast(m[0],'¡Medalla desbloqueada: '+m[1]+'!',m[2])});
  render();
}

  <div class="grid sm:grid-cols-2 gap-2">${q.options.map((o,i)=>`<div class="p-2 rounded-lg border border-slate-200 ${i===c?'bg-emerald-50':''}"><b>${'ABCD'[i]}.</b>${q.image_path?'':' '+E(o)}${i===c?' ✅':''}</div>`).join('')}</div>
  ${kk&&kk.explanation?`<div class="text-slate-600">💡 ${E(kk.explanation)}</div>`:''}
  ${adm?`<div class="flex flex-wrap gap-2"><button onclick="setQ('${q.id}',{active:${!q.active}})" class="px-3 py-1.5 rounded-lg ${q.active?'bg-slate-200':'bg-emerald-600 text-white'} text-xs">${q.active?'Ocultar a estudiantes':'Mostrar a estudiantes'}</button><button onclick="setQ('${q.id}',{status:'${q.status==='published'?'draft':'published'}'})" class="px-3 py-1.5 rounded-lg ${q.status==='published'?'bg-slate-200':'bg-indigo-600 text-white'} text-xs">${q.status==='published'?'Volver a borrador':'Marcar como revisada'}</button></div>`:''}</div>`}).join('')||'<div class="bg-white rounded-2xl p-6 shadow text-center text-slate-600">No hay preguntas con ese filtro.</div>'}
  <div class="flex justify-between items-center"><button ${QF.p?'':'disabled'} onclick="QF.p--;go('preg')" class="px-4 py-2 rounded-lg bg-slate-200 disabled:opacity-40">← Anterior</button><span class="text-sm text-slate-600">Página ${QF.p+1} de ${pages}</span><button ${QF.p+1<pages?'':'disabled'} onclick="QF.p++;go('preg')" class="px-4 py-2 rounded-lg bg-indigo-600 text-white disabled:opacity-40">Siguiente →</button></div></div>`}
function vVideo(){
  const c=D.cls||{},prof=M.role==='prof',live=!!(c.is_live&&c.video_url);
  const badge=live?'<span style="background:#dc2626;color:#fff;padding:1px 10px;border-radius:9999px">● EN VIVO</span>':'<span class="text-slate-500">⚪ Sin clase en vivo</span>';
  if(prof)return`<div class="flex justify-between text-xs mb-2"><span>${badge}</span></div><div class="space-y-3"><label class="text-sm block">Título de la clase<input id="ct" class="w-full border rounded-lg p-2 mt-1" value="${E(c.title||'')}"></label>
  <label class="text-sm block">Enlace de la reunión (Meet, Zoom o Jitsi, debe empezar con https://)<input id="cu" class="w-full border rounded-lg p-2 mt-1" placeholder="https://meet.google.com/abc-defg-hij" value="${E(c.video_url||'')}"></label>
  <label class="text-sm flex items-center gap-2"><input id="cl" type="checkbox" ${c.is_live?'checked':''}> Clase en vivo (los estudiantes verán el botón para unirse)</label>
  <div class="flex flex-wrap gap-2 items-center"><button onclick="saveClass()" class="px-4 py-2 rounded-lg bg-emerald-600 text-white">Guardar</button><a href="https://meet.google.com/new" target="_blank" rel="noopener noreferrer" class="text-sm text-indigo-600 underline">Crear reunión nueva en Google Meet</a>${live?`<a href="${E(c.video_url)}" target="_blank" rel="noopener noreferrer" class="text-sm text-indigo-600 underline">Abrir mi clase</a>`:''}</div></div>`;
  return`<div class="flex justify-between text-xs mb-2"><span>${badge} · ${E(c.title||'Clase')}</span></div>${live?`<div class="text-center space-y-2 p-4"><div class="text-4xl">🎥</div><p class="text-sm text-slate-600">Tu docente ya inició la clase.</p><a href="${E(c.video_url)}" target="_blank" rel="noopener noreferrer" class="inline-block px-5 py-2 rounded-lg bg-emerald-600 text-white">Unirme a la clase</a></div>`:`<div class="text-center p-4 text-sm text-slate-500"><div class="text-4xl">🕒</div>Tu docente aún no ha iniciado la clase. Esta pantalla se actualiza sola.</div>`}`}
function paintVideo(){const b=document.getElementById('vbox');if(b)b.innerHTML=vVideo()}
function vClase(){const prof=M.role==='prof';return`<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 space-y-3"><div id="vbox" class="bg-white rounded-2xl p-4 shadow">${vVideo()}</div>
  <div class="bg-white rounded-2xl p-4 shadow"><h3 class="font-semibold mb-2">Asistencia de hoy</h3>${prof?`<div class="grid sm:grid-cols-2 gap-2">${(D.est||[]).map(u=>`<label class="flex items-center gap-2 p-2 border rounded-lg text-sm"><input type="checkbox" ${D.att[u.id]?'checked':''} onchange="toggleAtt('${u.id}',this.checked)"> ${E(u.full_name)} <span class="text-slate-400">${u.grade??''}°</span></label>`).join('')||'<p class="text-sm text-slate-500">Aún no tienes estudiantes registrados.</p>'}</div>`:`<button onclick="toggleAtt(M.id,${!D.me})" class="px-4 py-2 rounded-lg ${D.me?'bg-emerald-600':'bg-indigo-600'} text-white">${D.me?'✅ Asistencia marcada':'Marcar mi asistencia'}</button>`}</div></div>
  <div class="bg-white rounded-2xl p-4 shadow flex flex-col h-[28rem]"><h3 class="font-semibold mb-2">💬 Chat</h3><div id="chatbox" class="flex-1 overflow-y-auto space-y-2 text-sm"></div><div class="flex gap-2 mt-2"><input id="msg" onkeydown="if(event.key==='Enter')sendChat()" class="flex-1 border rounded-lg p-2 text-sm" placeholder="Escribe un mensaje…"><button onclick="sendChat()" class="px-3 bg-indigo-600 text-white rounded-lg">➤</button></div></div></div>`}
function paintChat(){const b=document.getElementById('chatbox');if(!b)return;b.innerHTML=(D.chat||[]).slice(-50).map(c=>`<div class="${c.user_id===M.id?'text-right':''}"><span class="text-[11px] text-slate-500">${E(c.author_name)}</span><div class="block"><span class="inline-block bg-slate-100 rounded-lg px-3 py-1">${E(c.body)}</span></div></div>`).join('');b.scrollTop=b.scrollHeight}

function render(){
  charts.forEach(c=>c.destroy());charts=[];
  const root=document.getElementById('app');
  if(!M){root.innerHTML=vAuth();return}
  if(M.role==='prof'&&M.teacher_status!=='aprobado'){root.innerHTML=vPend();return}
  const prof=M.role==='prof';
  const tabs=prof?[['prof','📊 Panel'],...(M.is_admin?[['doc','👩‍🏫 Docentes'+(D.pend?' ('+D.pend+')':'')]]:[]),['cur','👥 Cursos y estudiantes'],['simp','🚀 Simulacros y tareas'],['imp','🖨️ Imprimir'],['cal','📷 Calificar'],['preg','📚 Preguntas'],['clase','🎥 Clase']]:[['sim','📝 Mis simulacros y tareas'],['est','📊 Mis estadísticas'],['med','🏆 Logros'],['lb','🏅 Ranking'],['clase','🎥 Clase']];
  const body={sim:vSim,simp:vSimP,cur:vCur,imp:vImp,cal:vCal,doc:vDoc,est:vEst,med:vMed,prof:vProf,preg:vPreg,clase:vClase,lb:vLb}[tab]();
  root.innerHTML=`<header class="flex flex-wrap gap-3 justify-between items-center mb-4"><div><h1 class="text-2xl font-extrabold text-indigo-700">🎓 AulaICFES</h1><p class="text-xs text-slate-500">${E(M.full_name)} · ${prof?(M.is_admin?'Administrador':'Docente'+((M.asignaturas||[]).length?' · '+E(M.asignaturas.join(', ')):'')):'Estudiante'+(M.grade?' · '+M.grade+'°':'')}</p></div><div class="flex gap-2"><button onclick="passModal()" class="text-sm px-3 py-1.5 bg-white rounded-lg shadow">🔑 Contraseña</button><button onclick="logout()" class="text-sm px-3 py-1.5 bg-white rounded-lg shadow">Salir</button></div></header>
  <div id="livebar">${vLive()}</div>
  <nav class="flex gap-2 overflow-x-auto mb-4">${tabs.map(([k,l])=>`<button onclick="go('${k}')" class="px-4 py-2 rounded-lg text-sm whitespace-nowrap shadow-sm ${tab===k?'on':'bg-white'}">${l}</button>`).join('')}</nav>${body}`;
  if(tab==='clase')paintChat();
  if(!window.Chart)return;
  const by=l=>{const m={};l.forEach(a=>(m[a.subject]=m[a.subject]||[]).push(a.score));return Object.entries(m).map(([k,x])=>[k,avg(x)])};
  if(tab==='est'&&(D.mine||[]).length){const sj=by(D.mine);charts.push(new Chart(document.getElementById('c1'),{type:'bar',data:{labels:sj.map(x=>x[0]),datasets:[{data:sj.map(x=>x[1]),backgroundColor:sj.map(x=>x[1]>=70?'#10b981':x[1]>=50?'#f59e0b':'#ef4444')}]},options:{scales:{y:{min:0,max:100}},plugins:{legend:{display:false}}}}));charts.push(new Chart(document.getElementById('c2'),{type:'line',data:{labels:D.mine.map((a,i)=>'#'+(i+1)),datasets:[{label:'Puntaje',data:D.mine.map(a=>a.score),borderColor:'#4f46e5',tension:.3}]},options:{scales:{y:{min:0,max:100}}}}))}
  if(tab==='prof'&&(D.all||[]).length){const sj=by(D.all);charts.push(new Chart(document.getElementById('c3'),{type:'bar',data:{labels:sj.map(x=>x[0]),datasets:[{data:sj.map(x=>x[1]),backgroundColor:'#6366f1'}]},options:{indexAxis:'y',scales:{x:{min:0,max:100}},plugins:{legend:{display:false}}}}))}
}
boot();
</script>
</body></html>
